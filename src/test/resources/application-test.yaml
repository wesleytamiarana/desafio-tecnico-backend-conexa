spring:
  application:
    name: cnx

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  datasource:
    username: cnx
    password: cnx
    url: jdbc:h2:mem:cnx_data;DB_CLOSE_DELAY=-1

  liquibase:
    enabled: true
    user: cnx
    password: cnx
    url: jdbc:h2:mem:cnx_data;DB_CLOSE_DELAY=-1
