databaseChangeLog:
  - changeSet:
      id: credenciais_20250417-01
      author: wesley.tamiarana@gmail.com
      changes:
        - createTable:
            tableName: credenciais
            columns:
              - column:
                  name: uuid
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: senha
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
