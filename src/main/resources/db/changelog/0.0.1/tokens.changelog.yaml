databaseChangeLog:
  - changeSet:
      id: tokens_20250419-01
      author: wesley.tamiarana@gmail.com
      changes:
        - createTable:
            tableName: tokens
            columns:
              - column:
                  name: uuid
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: valor
                  type: VARCHAR(500)
                  constraints:
                    unique: true
                    nullable: false

  - changeSet:
      id: tokens_20250419-02
      author: wesley.tamiarana@gmail.com
      changes:
        - addForeignKeyConstraint:
            baseTableName: tokens
            baseColumnNames: uuid
            referencedTableName: credenciais
            referencedColumnNames: uuid
            constraintName: tokens-FK_01
