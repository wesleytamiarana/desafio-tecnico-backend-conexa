databaseChangeLog:
  - changeSet:
      id: agendamentos_20250418-01
      author: wesley.tamiarana@gmail.com
      changes:
        - createTable:
            tableName: agendamentos
            columns:
              - column:
                  name: uuid
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uuid_credenciado
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: uuid_paciente
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: data_hora
                  type: DATETIME
                  constraints:
                    nullable: false

  - changeSet:
      id: agendamentos_20250418-02
      author: wesley.tamiarana@gmail.com
      preConditions:
        - and:
            - tableExists:
                tableName: agendamentos
            - columnExists:
               tableName: agendamentos
               columnName: uuid_credenciado
            - tableExists:
                tableName: credenciados
            - columnExists:
                 tableName: credenciados
                 columnName: uuid
      changes:
        - addForeignKeyConstraint:
            baseTableName: agendamentos
            baseColumnNames: uuid_credenciado
            referencedTableName: credenciados
            referencedColumnNames: uuid
            constraintName: agendamentos-FK_01

  - changeSet:
      id: agendamentos_20250418-03
      author: wesley.tamiarana@gmail.com
      preConditions:
        - and:
             - tableExists:
                 tableName: agendamentos
             - columnExists:
                 tableName: agendamentos
                 columnName: uuid_paciente
             - tableExists:
                 tableName: pacientes
             - columnExists:
                 tableName: pacientes
                 columnName: uuid
      changes:
        - addForeignKeyConstraint:
            baseTableName: agendamentos
            baseColumnNames: uuid_paciente
            referencedTableName: pacientes
            referencedColumnNames: uuid
            constraintName: agendamentos-FK_02

