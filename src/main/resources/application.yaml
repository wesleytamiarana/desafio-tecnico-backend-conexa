spring:
  application:
    name: cnx

  messages:
    encoding: UTF-8
    basename: messages

#  autoconfigure:
#    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  datasource:
    username: cnx
    password: cnx
    url: jdbc:h2:file:~/.cnx/cnx_data

  liquibase:
    enabled: true
    user: cnx
    password: cnx
    url: jdbc:h2:file:~/.cnx/cnx_data
    change-log: classpath:/db/changelog/master.changelog.yaml

  h2:
    console:
      enabled: true

  jpa:
    show-sql: false
    hibernate.ddl-auto: none

application:
  security:
       token:
          duration: 3600000
          signature-key: 5EDEC8E55CBA5A46AAB7DDF7D85BA85C3FF46259CC2B09ED7FBC47F4F13456AC

